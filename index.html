<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyImg - 圖片壓縮工具</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap CSS for UI components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <header class="text-center mb-3">
            <h1 class="h2 mb-2">
                <i class="bi bi-image"></i> TinyImg
            </h1>
            <p class="text-muted mb-0">快速壓縮圖片，一鍵複製到剪貼簿</p>
        </header>

        <main>
            <!-- Upload Area -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <i class="bi bi-cloud-upload h1 mb-3" style="color: #6c757d;"></i>
                    <p class="mb-2">拖曳圖片或點擊選擇</p>
                    <small>支援 JPG、PNG、WebP 或從剪貼簿貼上 (Ctrl+V)</small>
                    <input type="file" id="fileInput" accept="image/*" class="d-none">
                    <button class="btn btn-outline-secondary mt-3" id="selectBtn">
                        <i class="bi bi-folder2-open"></i> 選擇檔案
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container mt-4 d-none" id="progressContainer">
                <div class="progress">
                    <div class="progress-bar progress-bar-striped progress-bar-animated" 
                         id="progressBar" role="progressbar" style="width: 0%">
                    </div>
                </div>
                <div class="text-center mt-2">
                    <span id="progressText">處理中...</span>
                </div>
            </div>

            <!-- Results Area -->
            <div class="results-area mt-4 d-none" id="resultsArea">
                <!-- Main Copy Button - Large and Prominent -->
                <div class="text-center mb-4">
                    <button class="btn btn-dark btn-lg px-5 py-3 copy-main-btn" id="copyBtn">
                        <i class="bi bi-clipboard-check fs-4 me-2"></i>
                        <span class="fs-5">複製到剪貼簿</span>
                    </button>
                    <button class="btn btn-outline-secondary ms-3" id="downloadBtn">
                        <i class="bi bi-download"></i> 下載
                    </button>
                </div>

                <!-- Image Comparison - Clean -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body text-center p-3">
                                <h6 class="card-title text-muted mb-3">原始圖片</h6>
                                <img id="originalImage" class="img-fluid mb-3" style="max-height: 200px;">
                                <div>
                                    <span class="badge bg-light text-dark border" id="originalSize"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body text-center p-3">
                                <h6 class="card-title text-secondary mb-3">壓縮後</h6>
                                <img id="compressedImage" class="img-fluid mb-3" style="max-height: 200px;">
                                <div>
                                    <span class="badge bg-secondary" id="compressedSize"></span>
                                    <span class="badge bg-light text-dark border ms-1" id="compressionRatio"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Panel - Simplified -->
            <div class="settings-panel mt-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-3">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small">品質: <span id="qualityValue">80</span>%</label>
                                <input type="range" class="form-range" id="qualitySlider" 
                                       min="10" max="100" value="80">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">目標大小 (KB)</label>
                                <input type="number" class="form-control form-control-sm" id="maxSizeInput" 
                                       value="1024" min="50" max="5120">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">輸出格式</label>
                                <select class="form-select form-select-sm" id="formatSelect">
                                    <option value="image/png">PNG</option>
                                    <option value="image/jpeg">JPEG</option>
                                    <option value="image/webp">WebP</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center mt-4 py-2">
            <small class="text-muted">TinyImg - 純前端圖片壓縮工具</small>
        </footer>
    </div>

    <!-- Toast for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle text-primary me-2"></i>
                <strong class="me-auto">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody">
                <!-- Toast message will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JavaScript -->
    <script src="script.js"></script>
</body>
</html>
