name: Release extension

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build, scan for remote code, and zip (version from the tag)
        run: npm run package -w @tinyimg/extension -- "$GITHUB_REF_NAME"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "apps/extension/tinyimg-extension-${version}.zip" \
            --title "TinyImg ${GITHUB_REF_NAME}" \
            --notes "Chrome / Edge 外掛（Manifest V3）。安裝方式見 apps/extension/README 或 repo README。"
